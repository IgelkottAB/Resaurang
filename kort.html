<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundkort – Igelkotts restaurang</title><link rel="stylesheet" href="style.css"></head><body><main class="main" style="max-width:900px;margin:auto"><header class="topbar"><div><h1>💳 Kundkort</h1><p>Lägg till eller ta bort DEMO-kort.</p></div><a class="secondary" href="index.html" style="padding:10px 14px;border-radius:10px;text-decoration:none">← Till personalsidan</a></header><section class="panel"><h2>Registrera nytt kort</h2><p class="hint">Detta är endast för test. Kortkoden är 4 siffror och inga riktiga betalningsuppgifter sparas.</p><div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end"><label>Kortkod (4 siffror)<input id="code" inputmode="numeric" maxlength="4" placeholder="7394"></label><label>Kundnamn<input id="name" placeholder="T.ex. Lillebror"></label><button class="primary" id="add">＋ Lägg till</button></div></section><section class="panel"><h2>Registrerade DEMO-kort</h2><div id="cards"></div></section></main><script>const defaults={"1234":"Lillebror","5678":"Mamma","2468":"Pappa"};function get(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem('igelkott_demo_cards')||'{}'))}catch{return {...defaults}}}function save(x){localStorage.setItem('igelkott_demo_cards',JSON.stringify(x))}function render(){const x=get(),el=document.getElementById('cards');el.innerHTML=Object.entries(x).map(([c,n])=>`<div class="menu-admin-item"><div class="food-icon">💳</div><div><b>${c}</b><small>${n}</small></div><button class="icon-btn" onclick="removeCard('${c}')">🗑️ Ta bort</button></div>`).join('')||'<div class="empty">Inga kort registrerade.</div>'}function removeCard(c){if(!confirm('Ta bort kort '+c+'?'))return;const x=get();delete x[c];save(x);render()}document.getElementById('add').onclick=()=>{const c=document.getElementById('code').value.trim(),n=document.getElementById('name').value.trim();if(!/^\d{4}$/.test(c))return alert('Kortkoden måste vara exakt 4 siffror.');if(!n)return alert('Skriv ett kundnamn.');const x=get();if(x[c])return alert('Den kortkoden finns redan.');x[c]=n;save(x);document.getElementById('code').value='';document.getElementById('name').value='';render()};render();</script></body></html>
