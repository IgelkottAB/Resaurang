<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kundkort – Igelkotts restaurang</title><link rel="stylesheet" href="style.css"></head><body><main class="main" style="max-width:900px;margin:auto"><header class="topbar"><div><h1>💳 Kundkort</h1><p>Hantera DEMO-kort – lägg till, ändra och ta bort.</p></div><a class="secondary" href="index.html" style="padding:10px 14px;border-radius:10px;text-decoration:none">← Till personalsidan</a></header><section class="panel"><h2 id="formTitle">Registrera nytt kort</h2><p class="hint">Endast testkort. Inga riktiga betalningsuppgifter sparas.</p><div style="display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end"><label>Kortkod (4 siffror)<input id="code" inputmode="numeric" maxlength="4" placeholder="7394"></label><label>Kundnamn<input id="name" placeholder="T.ex. Lillebror"></label><button class="primary" id="saveCard">＋ Lägg till</button><button class="secondary hidden" id="cancelEdit">Avbryt</button></div><div id="msg" style="margin-top:10px"></div></section><section class="panel"><h2>Registrerade DEMO-kort</h2><div id="cards"></div></section></main><script>const defaults={"1234":"Lillebror","5678":"Mamma","2468":"Pappa"};let editing=null;function get(){try{const raw=JSON.parse(localStorage.getItem('igelkott_demo_cards')||'null');if(raw&&raw.cards)return raw.cards;if(raw&&typeof raw==='object')return raw}catch{}return {...defaults}}function save(x){localStorage.setItem('igelkott_demo_cards',JSON.stringify({cards:x}));try{new BroadcastChannel('igelkott-rest').postMessage('cards-update')}catch{}}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function render(){const x=get(),el=document.getElementById('cards');el.innerHTML=Object.entries(x).map(([c,n])=>`<div class="menu-admin-item"><div class="food-icon">💳</div><div style="flex:1"><b>${esc(c)}</b><small>${esc(n)}</small></div><button class="secondary" onclick="editCard('${c}')">✏️ Redigera</button><button class="icon-btn" onclick="removeCard('${c}')">🗑️ Ta bort</button></div>`).join('')||'<div class="empty">Inga kort registrerade.</div>'}function resetForm(){editing=null;document.getElementById('code').value='';document.getElementById('name').value='';document.getElementById('code').disabled=false;document.getElementById('saveCard').textContent='＋ Lägg till';document.getElementById('cancelEdit').classList.add('hidden');document.getElementById('formTitle').textContent='Registrera nytt kort'}function editCard(c){const x=get();if(!x[c])return;editing=c;document.getElementById('code').value=c;document.getElementById('name').value=x[c];document.getElementById('code').disabled=true;document.getElementById('saveCard').textContent='💾 Spara ändring';document.getElementById('cancelEdit').classList.remove('hidden');document.getElementById('formTitle').textContent='Redigera kort '+c;document.getElementById('name').focus()}function removeCard(c){const x=get();if(!x[c])return;if(!confirm('Ta bort DEMO-kort '+c+' ('+x[c]+')?'))return;delete x[c];save(x);if(editing===c)resetForm();render()}document.getElementById('saveCard').onclick=()=>{const c=document.getElementById('code').value.trim(),n=document.getElementById('name').value.trim();if(!/^\d{4}$/.test(c))return alert('Kortkoden måste vara exakt 4 siffror.');if(!n)return alert('Skriv ett kundnamn.');const x=get();if(editing){if(!x[editing])return resetForm();x[editing]=n}else{if(x[c])return alert('Den kortkoden finns redan.');x[c]=n}const wasEdit=!!editing;save(x);resetForm();render();alert(wasEdit?'Kortet ändrades.':'Kortet lades till.')}document.getElementById('cancelEdit').onclick=resetForm;render();</script></body></html>
